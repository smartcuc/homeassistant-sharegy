name: Sync Integrations to Standalone Repositories

on:
  push:
    branches:
      - main
    paths:
      - "integrations/**"
      - ".github/workflows/sync-integrations.yml"
  workflow_dispatch:

jobs:
  sync-iobroker:
    name: Sync ioBroker.sharegy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eswes repository
        uses: actions/checkout@v4

      - name: Sync files to smartcuc/ioBroker.sharegy
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_REPO_TOKEN is not set in GitHub Secrets! Please add a Personal Access Token with repo scope to GitHub repository secrets."
            exit 1
          fi

          git config --global user.name "Sharegy CI/CD Bot"
          git config --global user.email "bot@sharegy.de"

          git clone "https://x-access-token:${SYNC_TOKEN}@github.com/smartcuc/ioBroker.sharegy.git" /tmp/ioBroker.sharegy
          rsync -av --delete --exclude=".git" integrations/iobroker.sharegy/ /tmp/ioBroker.sharegy/

          cd /tmp/ioBroker.sharegy
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "sync: update ioBroker adapter from smartcuc/eswes (${{ github.sha }})"
            git push origin main
            echo "Successfully synced ioBroker.sharegy!"
          else
            echo "No changes detected in ioBroker adapter."
          fi

  sync-homeassistant:
    name: Sync homeassistant-sharegy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eswes repository
        uses: actions/checkout@v4

      - name: Sync files to smartcuc/homeassistant-sharegy
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_REPO_TOKEN is not set in GitHub Secrets! Please add a Personal Access Token with repo scope to GitHub repository secrets."
            exit 1
          fi

          git config --global user.name "Sharegy CI/CD Bot"
          git config --global user.email "bot@sharegy.de"

          git clone "https://x-access-token:${SYNC_TOKEN}@github.com/smartcuc/homeassistant-sharegy.git" /tmp/homeassistant-sharegy
          rsync -av --delete --exclude=".git" integrations/homeassistant/ /tmp/homeassistant-sharegy/

          cd /tmp/homeassistant-sharegy
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "sync: update Home Assistant component from smartcuc/eswes (${{ github.sha }})"
            git push origin main
            echo "Successfully synced homeassistant-sharegy!"
          else
            echo "No changes detected in Home Assistant integration."
          fi
