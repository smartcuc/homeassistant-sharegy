id: growatt_server
name: Growatt ShineServer
vendor: Growatt
category: inverter_hybrid
protocol: http_cloud
description: "Cloud-Schnittstelle für alle Growatt Wechselrichter (MIC, MIN, MOD, MID, SPH, SPA, Noah) und ARK-Batteriespeicher über Growatt OpenAPI oder ShinePhone-App Login."

help:
  de: "Unterstützt 2 Verbindungsarten:\n\nOption A (Empfohlen - OpenAPI Token):\n1. Logge dich im Growatt Portal (server.growatt.com oder openapi.growatt.com) ein.\n2. Gehe auf 'Benutzerzentrum' bzw. 'API Management' und generiere einen 'OpenAPI Token'.\n3. Trage den Token und optional deine Plant-ID oder Wechselrichter-SN ein.\n\nOption B (Direkt-Login / ShinePhone App):\n1. Gib einfach deinen ShinePhone / ShineServer Benutzernamen und dein Passwort ein.\n2. Sharegy erkennt deine PV-Anlage und Wechselrichter automatisch."
  en: "Supports 2 connection methods:\n\nOption A (Recommended - OpenAPI Token):\n1. Log into the Growatt portal (server.growatt.com or openapi.growatt.com).\n2. Navigate to 'User Center' / 'API Management' to generate an 'OpenAPI Token'.\n3. Enter your Token and optionally your Plant ID or Inverter SN.\n\nOption B (Direct Login / ShinePhone App):\n1. Enter your ShinePhone / ShineServer username and password.\n2. Sharegy will auto-discover your plants and inverters."

connection:
  auth_type: api_key
  default_base_url: "https://openapi.growatt.com/v1"
  polling_interval_seconds: 60
  fields:
    - key: token
      label: "OpenAPI Token (Option A)"
      type: password
      required: false
      description: "Dein OpenAPI Token aus dem Growatt ShineServer Benutzerkonto (für Option A)."
      placeholder: "z. B. 3f9a7812bc44e..."
    - key: user_account
      label: "ShinePhone Benutzername / E-Mail (Option B)"
      type: string
      required: false
      description: "Dein Benutzername für die ShinePhone App / ShineServer (für Option B)."
      placeholder: "z. B. max.mustermann"
    - key: user_password
      label: "ShinePhone Passwort (Option B)"
      type: password
      required: false
      description: "Dein Passwort für die ShinePhone App / ShineServer (für Option B)."
      placeholder: "••••••••"
    - key: plant_id
      label: "Anlagen-ID (Optional)"
      type: string
      required: false
      description: "Wird bei Bedarf automatisch ermittelt. Falls bekannt, z. B. 194820."
      placeholder: "z. B. 194820"
    - key: device_sn
      label: "Wechselrichter Seriennummer (Optional)"
      type: string
      required: false
      description: "Seriennummer des Wechselrichters oder Dataloggers (ShineWiFi)."
      placeholder: "z. B. QDE4A21001"

requests:
  telemetry:
    method: POST
    endpoint: "/plant/data/overview"
    headers:
      Content-Type: "application/json"
      token: "{{token}}"
    body:
      plant_id: "{{plant_id}}"

metrics_mapping:
  pv_power_w:
    jsonpath: "$.data.ppv"
    scale: 1.0
    type: float
    min: 0.0
    max: 100000.0
    fallback: 0.0
  grid_power_w:
    jsonpath: "$.data.pgrid"
    scale: 1.0
    type: float
    min: -100000.0
    max: 100000.0
    fallback: 0.0
  load_power_w:
    jsonpath: "$.data.pload"
    scale: 1.0
    type: float
    min: 0.0
    max: 100000.0
    fallback: 0.0
  battery_power_w:
    jsonpath: "$.data.pdisCharge"
    scale: 1.0
    type: float
    min: -50000.0
    max: 50000.0
    fallback: 0.0
  battery_soc:
    jsonpath: "$.data.soc"
    scale: 1.0
    type: float
    unit: "%"
    min: 0.0
    max: 100.0
    fallback: null
  daily_generation_kwh:
    jsonpath: "$.data.eToday"
    scale: 1.0
    type: float
    unit: "kWh"
    fallback: 0.0
