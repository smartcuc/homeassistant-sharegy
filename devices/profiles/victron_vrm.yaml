id: "victron_vrm"
name: "Victron Energy VRM Portal API"
vendor: "Victron"
category: "inverter_hybrid"
protocol: "http_cloud"
description: "Cloud-Schnittstelle für Victron MultiPlus-II, Quattro, Cerbo GX und SmartSolar via VRM Portal API."

help:
  de: "1. Logge dich im Victron VRM Portal ein (vrm.victronenergy.com).\n2. Gehe zu 'Preferences' -> 'Personal access tokens' und generiere einen Token (oder gib deine VRM E-Mail & Passwort ein).\n3. Deine Installation-ID (Site ID) wird automatisch erkannt (oder aus der URL entnommen)."
  en: "1. Log into the Victron VRM Portal (vrm.victronenergy.com).\n2. Go to 'Preferences' -> 'Personal access tokens' and generate a token (or enter your VRM email & password).\n3. Your Installation ID (Site ID) is automatically discovered (or found in the URL)."

connection:
  auth_type: "token_or_basic"
  default_base_url: "https://vrmapi.victronenergy.com/v2"
  polling_interval_seconds: 60
  fields:
    - key: "access_token"
      label: "VRM Personal Access Token (Empfohlen)"
      type: "password"
      required: false
      placeholder: "z. B. vrm_pat_..."
    - key: "username"
      label: "VRM E-Mail / Benutzername (Alternative)"
      type: "string"
      required: false
      placeholder: "name@beispiel.de"
    - key: "password"
      label: "VRM Passwort (Alternative)"
      type: "password"
      required: false
    - key: "site_id"
      label: "VRM Installation ID (Site ID, Optional)"
      type: "string"
      required: false
      placeholder: "z. B. 123456 (wird sonst autom. ermittelt)"

requests:
  telemetry:
    method: "GET"
    endpoint: "/installations/{{site_id}}/system-overview"
    headers:
      "X-Authorization": "Token {{access_token}}"

metrics_mapping:
  pv_power_w:
    jsonpath: "$.records.solar_yield"
    scale: 1.0
    type: "float"
    fallback: 0.0
  grid_power_w:
    jsonpath: "$.records.grid_power"
    scale: 1.0
    type: "float"
    fallback: 0.0
  load_power_w:
    jsonpath: "$.records.consumption"
    scale: 1.0
    type: "float"
    fallback: 0.0
  battery_power_w:
    jsonpath: "$.records.battery_power"
    scale: 1.0
    type: "float"
    fallback: 0.0
  battery_soc:
    jsonpath: "$.records.soc"
    scale: 1.0
    type: "float"
    unit: "%"
    fallback: null
