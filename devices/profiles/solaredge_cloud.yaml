id: "solaredge_cloud"
name: "SolarEdge Monitoring API"
vendor: "SolarEdge"
category: "inverter_hybrid"
protocol: "http_cloud"
description: "Cloud-Schnittstelle für SolarEdge Monitoring Portal (Wechselrichter, Leistungsoptimierer & StorEdge Speicher)."

help:
  de: "1. Logge dich im SolarEdge Monitoring Portal (monitoring.solaredge.com) ein.\n2. Gehe auf 'Admin' -> 'Standortzugriff' (Site Access).\n3. Scrolle zum Abschnitt 'API-Zugriff', akzeptiere die Bedingungen und generiere deinen 'API-Schlüssel'.\n4. Notiere dir deine 'Standort-ID' (Site ID) und trage beides unten ein."
  en: "1. Log into the SolarEdge Monitoring Portal (monitoring.solaredge.com).\n2. Navigate to 'Admin' -> 'Site Access'.\n3. Scroll down to 'API Access', accept terms and generate your 'API Key'.\n4. Copy your 'Site ID' and 'API Key' into the form below."

connection:

  auth_type: "api_key_query"     # api_key_query, api_key_header, bearer_token
  default_base_url: "https://monitoringapi.solaredge.com"
  polling_interval_seconds: 60
  fields:
    - key: "site_id"
      label: "SolarEdge Anlagen-ID (Site ID)"
      type: "string"
      required: true
      description: "Deine Site ID aus dem SolarEdge Portal"
      placeholder: "z. B. 123456"
    - key: "api_key"
      label: "SolarEdge API-Key"
      type: "password"
      required: true
      description: "Generierter API-Key aus den SolarEdge Admin-Einstellungen"
      placeholder: "32-stelliger Hex-Key"

requests:
  telemetry:
    method: "GET"
    endpoint: "/site/{{site_id}}/currentPowerFlow.json"
    params:
      api_key: "{{api_key}}"

metrics_mapping:
  pv_power_w:
    jsonpath: "$.siteCurrentPowerFlow.PV.currentPower"
    scale: 1000.0
    type: "float"
    fallback: 0.0
  grid_power_w:
    jsonpath: "$.siteCurrentPowerFlow.GRID.currentPower"
    scale: 1000.0
    type: "float"
    fallback: 0.0
  load_power_w:
    jsonpath: "$.siteCurrentPowerFlow.LOAD.currentPower"
    scale: 1000.0
    type: "float"
    fallback: 0.0
  battery_power_w:
    jsonpath: "$.siteCurrentPowerFlow.STORAGE.currentPower"
    scale: 1000.0
    type: "float"
    fallback: 0.0
  battery_soc:
    jsonpath: "$.siteCurrentPowerFlow.STORAGE.chargeLevel"
    scale: 1.0
    type: "float"
    unit: "%"
    fallback: null
