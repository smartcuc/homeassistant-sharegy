id: "sungrow_isolarcloud"
name: "Sungrow iSolarCloud"
vendor: "Sungrow"
category: "inverter_hybrid"
protocol: "http_cloud"
description: "Offizielle OpenAPI & OAuth 2.0 Schnittstelle für alle Sungrow Hybrid-Wechselrichter (SH-Serie wie SH5.0RT, SH10RT, SH15T, SH25T) und SBR-Batteriespeicher."

help:
  de: "1. Klicke auf 'iSolarCloud 1-Klick verbinden', um deine Anlage direkt über das offizielle Sungrow Portal zu autorisieren.\n2. Deine Anlagen-ID (ps_id) und alle Wechselrichter & Heimspeicher werden automatisch erkannt und verknüpft."
  en: "1. Click 'Connect iSolarCloud 1-Click' to authorize your solar plant directly via the official Sungrow portal.\n2. Your plant ID (ps_id) and all inverters & batteries will be automatically discovered."

# Verbindungskonfiguration & UI-Formularfelder
connection:
  auth_type: "oauth2"
  default_base_url: "https://gateway.isolarcloud.eu"
  polling_interval_seconds: 15
  fields:
    - key: "appkey"
      label: "Sungrow AppKey"
      type: "string"
      required: false
      description: "Dein iSolarCloud Developer AppKey (optional, falls ein eigener Schlüssel genutzt werden soll)"
      placeholder: "z. B. 988713D7D057090474AEC9584CBA1AAD"
    - key: "ps_id"
      label: "Anlagen-ID (Power Station ID)"
      type: "string"
      required: false
      description: "Wird bei der Autorisierung automatisch ermittelt (oder manuell aus der URL eintragen)"
      placeholder: "z. B. 1234567"

# HTTP API Endpoints (Offizielle OpenAPI)
requests:
  telemetry:
    method: "POST"
    endpoint: "/openapi/platform/getPowerStationRealTimeData"
    headers:
      "Content-Type": "application/json"
      "sys_code": "901"
      "token": "{{token}}"
    body:
      appkey: "{{appkey}}"
      token: "{{token}}"
      ps_id_list:
        - "{{ps_id}}"
      point_id_list:
        - "83033"
        - "83067"
        - "83052"
        - "83106"
        - "83051"
        - "83549"
        - "83129"
        - "83252"
        - "83238"
        - "83104"
        - "83111"
        - "83112"
        - "83326"
        - "83328"
        - "83329"
        - "83330"
        - "83334"
      is_get_point_dict: "1"

# Mappings: Sungrow-JSON -> Sharegy Canonical Energy Metrics
metrics_mapping:
  pv_power_w:
    jsonpath: "$.result_data.curr_power"
    scale: 1000.0
    type: "float"
    min: 0.0
    max: 100000.0
    fallback: 0.0

  grid_power_w:
    jsonpath: "$.result_data.grid_power"
    scale: 1000.0
    type: "float"
    min: -100000.0
    max: 100000.0
    fallback: 0.0

  load_power_w:
    jsonpath: "$.result_data.load_power"
    scale: 1000.0
    type: "float"
    min: 0.0
    max: 100000.0
    fallback: 0.0

  battery_power_w:
    jsonpath: "$.result_data.battery_power"
    scale: 1000.0
    type: "float"
    min: -50000.0
    max: 50000.0
    fallback: 0.0

  battery_soc:
    jsonpath: "$.result_data.battery_soc"
    scale: 1.0
    type: "float"
    unit: "%"
    min: 0.0
    max: 100.0
    fallback: null
