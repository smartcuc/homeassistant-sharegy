push_telemetry:
  name: Telemetrie übertragen
  description: Überträgt Messwerte lokaler Sensoren verschlüsselt an Sharegy.
  fields:
    devices:
      name: Geräte & Messwerte
      description: Liste von Geräten mit Messwerten (power_w, energy_kwh, role).
      required: true
      example: '[{"identifier": "shelly_3em", "name": "Hauptanschluss", "power_w": 450.0, "role": "grid"}]'

set_floor_heating_boost:
  name: Fußbodenheizung Boost steuern
  description: Schaltet den thermischen Vorheiz-Boost für den Estrich-Speicher ein oder aus.
  fields:
    active:
      name: Aktivieren
      description: True für Boost EIN, False für AUS.
      required: true
      selector:
        boolean:

set_bwwp_switch:
  name: Brauchwasser-Wärmepumpe schalten
  description: Schaltet die SG-Ready Boost Anhebung der Brauchwasser-Wärmepumpe.
  fields:
    state:
      name: Status
      description: True für Boost EIN, False für AUS.
      required: true
      selector:
        boolean:
    reason:
      name: Grund
      description: Optionaler Grund für das Logbuch.
      required: false
      example: "PV-Überschuss erkannt"
