push_telemetry:
  name: Push Telemetry to Sharegy
  description: Überträgt lokale Home Assistant Sensorwerte (z. B. Shelly, Wallbox, Wärmepumpe) verschlüsselt an Sharegy HEMS.
  fields:
    devices:
      name: Devices
      description: Liste von Geräten mit identifier, power_w, energy_kwh und role (grid/producer/consumer/battery).
      required: true
      example: '[{"identifier": "shelly_3em", "power_w": 2450.5, "energy_kwh": 1420.8, "role": "grid"}]'
      selector:
        object:

