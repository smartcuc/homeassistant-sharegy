apiVersion: 1

datasources:
  - name: Sharegy HEMS
    type: simpod-json-datasource
    access: proxy
    url: http://localhost:8000/api/grafana
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
    secureJsonData:
      httpHeaderValue1: "Bearer YOUR_SHAREGY_API_KEY_OR_MQTT_TOKEN"
    customHeaders:
      Authorization: "Bearer YOUR_SHAREGY_API_KEY_OR_MQTT_TOKEN"

